<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#3158d5">
<title>一起去 · 周末城市探索指南</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 引导页：选节奏 -->
<div id="onboard" class="onboard-layer" style="display:none"></div>

<!-- 主应用 -->
<div id="app" class="phone" style="display:none">
  <header id="header" class="header"></header>
  <main id="content" class="content">
    <section id="view-discover" class="view active"></section>
    <section id="view-plan" class="view"></section>
    <section id="view-team" class="view"></section>
    <section id="view-checkin" class="view"></section>
    <section id="view-guide" class="view"></section>
  </main>
  <nav class="tabbar">
    <button class="tab active" data-tab="discover"><span>🧭</span>发现</button>
    <button class="tab" data-tab="plan"><span>🎒</span>计划</button>
    <button class="tab" data-tab="team"><span>👥</span>组队</button>
    <button class="tab" data-tab="checkin"><span>📍</span>打卡</button>
    <button class="tab" data-tab="guide"><span>📝</span>攻略</button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  /* 底部导航绑定 */
  document.querySelectorAll('.tab').forEach(b =>
    b.addEventListener('click', () => YQ.goTab(b.dataset.tab)));
</script>
</body>
</html>
